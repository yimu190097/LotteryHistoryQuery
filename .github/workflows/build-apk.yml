name: Build & Release APK v24.2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
      - name: Build User App Release APK
        run: |
          sed -i '/org.gradle.java.home/d' gradle.properties
          sed -i '/proxyHost/d' gradle.properties
          sed -i '/proxyPort/d' gradle.properties
          sed -i '/nonProxyHosts/d' gradle.properties
          echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m" >> gradle.properties
          gradle assembleRelease --no-daemon -x test
      - name: Build Admin App Release APK
        run: |
          gradle :admin-app:assembleRelease --no-daemon -x test
      - name: 收集构建产物
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          if [ -z "$APK" ]; then
            echo "NO USER APK"
            find app/build/outputs -type f
            exit 1
          fi
          cp "$APK" "LotteryHistoryQuery_v24.2.apk"
          ls -lh LotteryHistoryQuery_v24.2.apk
          ADMIN_APK=$(find admin-app/build/outputs/apk/release -name "*.apk" | head -1)
          if [ -n "$ADMIN_APK" ]; then
            cp "$ADMIN_APK" "LotteryAdmin_v1.0.apk"
            ls -lh LotteryAdmin_v1.0.apk
          else
            echo "NO ADMIN APK"
          fi
      - name: 下传 APK 到服务器
        if: env.SERVER_URL != ''
        env:
          SERVER_URL: ${{ secrets.SERVER_URL }}
          SERVER_TOKEN: ${{ secrets.SERVER_TOKEN }}
        run: |
          HTTP_CODE=$(curl -sS -o /tmp/upload_resp.txt -w "%{http_code}" -X POST "${SERVER_URL}/api/upload-apk" -H "Authorization: Bearer ${SERVER_TOKEN}" -F "apk=@LotteryHistoryQuery_v24.2.apk")
          echo "user: $HTTP_CODE $(head -3 /tmp/upload_resp.txt)"
          if [ -f "LotteryAdmin_v1.0.apk" ]; then
            HTTP_CODE=$(curl -sS -o /tmp/upload_resp.txt -w "%{http_code}" -X POST "${SERVER_URL}/api/upload-apk" -H "Authorization: Bearer ${SERVER_TOKEN}" -F "apk=@LotteryAdmin_v1.0.apk")
            echo "admin: $HTTP_CODE $(head -3 /tmp/upload_resp.txt)"
          fi
      - name: 创建 GitHub Release v24.2
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v24.2
          name: v24.2 公网部署版 · 指向 Ubuntu 虚拟机云端地址
          body: |
            ## v24.2 公网部署版 · 双端 APK
            ### 用户端 APP
            - `LotteryHistoryQuery_v24.2.apk`
            ### 管理端 APP
            - `LotteryAdmin_v1.0.apk`
          files: |
            LotteryHistoryQuery_v24.2.apk
            LotteryAdmin_v1.0.apk
          prerelease: false