name: Build & Release APK v22

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        id: setup-java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Release APK
        run: |
          # 移除本地硬编码 Java 路径 + 代理（CI 无代理）
          sed -i '/org.gradle.java.home/d' gradle.properties
          sed -i '/proxyHost/d' gradle.properties
          sed -i '/proxyPort/d' gradle.properties
          sed -i '/nonProxyHosts/d' gradle.properties
          gradle assembleRelease --no-daemon -x test

      - name: 收集构建产物
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          if [ -z "$APK" ]; then
            echo "❌ 未找到 APK，构建失败"
            find app/build/outputs -type f
            exit 1
          fi
          cp "$APK" "LotteryHistoryQuery_v22.apk"
          ls -lh LotteryHistoryQuery_v22.apk

      - name: 创建 GitHub Release v22
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v22.0
          name: v22.0 按期自适应展示+同等奖注数合并+追加投注金额分开展示+规则版本分组标题
          body: |
            ## v22.0 核心升级：奖项展示逻辑随期数动态调整，彻底解决跨期跨规则混淆

            ### 🔴 展示层：同等奖合并原则（同质合并 / 异质分开）
            - **注数列：同等奖名累加合并**（基本投注注数 + 追加投注注数）— 注数是同质总量，可加
            - **金额列：基本/追加投注分两行独立展示** — 金额维度不同，绝不合并（防止用户误以为总额）
            - **命中规则列：同奖名下多条（如三等奖=5+0和4+2）换行拼接，一起呈现**
            - DrawDetailDialog各列maxLines调大到5~10，全部支持多行自适应换行

            ### 🟢 跨期分组：避免同页面展示不同期数规则（用户一眼分清规则边界）
            - **History多期列表：按 ruleVersionKey 分组 Section 标题**
              - 每组第一期顶部显示绿色卡片标题：【政策标签】+ 生效日期 + 本组共N期 + 变更说明概要
              - 当连续两期的 ruleVersionKey 不一致时才插入分组标题；一致时不插入，视觉自然连续
            - **每期item右上角政策标签徽章**（绿色圆角小标签）
              - 即便在组内也显示，防止滚到中间忘记当前属于哪个规则阶段
            - **LatestDraws每个彩种卡片：彩种名后加政策标签徽章**
              - 重要：用 `draw.resolveRuleVersion(config)`（该期开奖当时适用的规则），而不是 config最新版
              - 避免：大乐透最新一期实际是老9级，但徽章误标"2026新规·7级"

            ### 🟤 新增资源
            - bg_policy_badge.xml（绿色小圆角徽章背景）
            - bg_policy_section_header.xml（浅绿色分组Section背景）
            - item_history.xml：新增 tvRuleSectionHeader + tvPolicyBadge 两个视图引用

            ### 🔵 数据库：DB v10 追加投注字段完整贯通（LotteryXlsParser→Entity→Model→DrawDetailDialog）
            - appendPrizeTiers: List<PrizeTierEntry?> 从解析到展示全链路
          files: LotteryHistoryQuery_v22.apk
          prerelease: false
