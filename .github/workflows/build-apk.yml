name: Build & Release APK v23

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        id: setup-java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Release APK
        run: |
          # 移除本地硬编码 Java 路径 + 代理（CI 无代理）
          sed -i '/org.gradle.java.home/d' gradle.properties
          sed -i '/proxyHost/d' gradle.properties
          sed -i '/proxyPort/d' gradle.properties
          sed -i '/nonProxyHosts/d' gradle.properties
          gradle assembleRelease --no-daemon -x test

      - name: 收集构建产物
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          if [ -z "$APK" ]; then
            echo "❌ 未找到 APK，构建失败"
            find app/build/outputs -type f
            exit 1
          fi
          cp "$APK" "LotteryHistoryQuery_v23.apk"
          ls -lh LotteryHistoryQuery_v23.apk

      - name: 创建 GitHub Release v23
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v23.0
          name: v23.0 期政策自适应展示 · 分组展示+期号绑定徽章+开发插件全量集成
          body: |
            ## v23.0 核心：旧版 Release 全部清理 → 重新生成最新发行版（commit 0f0f91e，含 detekt/spotless/jacoco/versions 开发插件 + 期政策自适应）

            ### 🗂️ 旧 Release 清理清单
            - 已删除 v22.0 / v21.0 / v20 / v9.0 以及历史 tags v14.0 / v19，保持发行版列表纯净

            ### 🟢 期政策自适应（核心功能）
            - **版本定位三级兜底**：ruleVersionKey（解析时写入）> 期号 issue 前缀推断年份 > date 字段 > 最新版保底
            - **选号命中统计按政策版本独立分组**：DLT 2026 新规（7级奖池联动）七等奖 0+2 与 DLT 2019（9级）七等奖 4+0 分两行独立显示，杜绝"同奖名跨政策合并"的金额误导
            - **政策徽章绑定期号**：LatestDrawsDialog 徽章 / DrawDetailDialog 顶部绿卡 追加显示 `期号：XXX`，明确期号↔政策映射关系
            - **Seed 老期版本定位**：断网走 seed 无 date 时，按期号前缀推断年份（SSQ 前4位=年 / DLT 前2位补20），避免老期错误套最新版规则

            ### 🛠️ Gradle 开发插件（本版本新集成）
            - **Detekt 1.23.6**：Kotlin 静态代码分析，buildUponDefaultConfig + reportsDir 输出
            - **Spotless 6.25.0**：ktfmt 0.46 kotlinlangStyle 自动格式化，trimTrailingWhitespace + endWithNewline
            - **JaCoCo**：debug buildType 启用单元测试覆盖率，按 variant 动态注册 `jacoco{Variant}UnitTestReport` 任务（HTML + XML 双报告）
            - **Ben-Manes versions 0.51.0**：`gradle dependencyUpdates` 一键检查过时依赖

            ### 🟤 条件奖级标志（不误导用户）
            - 双色球福运奖：奖池 < 15 亿 时整行浅灰 + "奖池未达门槛，本奖项停发"（非"空开"误导字样）
            - 大乐透浮动：奖池 ≥ 8 亿 时 三~七等奖 命中规则列绿色高亮显示"本期奖池≥8亿已上浮¥XXX"
            - 页尾提示与行内 flag 用词一致（conditionalFlags 复算开关统一）

            ### 📱 手机端 6 项自测要点
            1. 启动/下拉刷新不死锁（Mutex 嵌套持锁修复）
            2. 首页最新一期徽章：`2026新规｜期号2026090` / `超级大乐透2026新规｜期号26088`
            3. 详情弹窗政策卡：【本期适用】超级大乐透2026新规 **期号：26088** + 展开历史版本
            4. ★ 大乐透 0+2 选号命中 → 两个绿色分组标题（DLT 2026 7级 + DLT 2019 9级）独立分行，不合并
            5. 断网重装 seed 老期（issue≈20020）→ 正确显示超级大乐透2019版（9级）9对奖级
            6. SSQ 福运奖停发灰底 / DLT 上浮绿色提示 显示一致
          files: LotteryHistoryQuery_v23.apk
          prerelease: false
