name: Build & Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.name }}
      user_apk: ${{ steps.tag.outputs.user_apk }}
      admin_apk: ${{ steps.tag.outputs.admin_apk }}
    steps:
      # 每次构建动态生成发布标签（P2-4: 避免硬编码 v24.2 导致多版本互相覆盖、旧 Release 报错）
      - name: 计算动态发布标签
        id: tag
        run: |
          TAG="cmd-$(date +%Y%m%d-%H%M%S)-${{ github.run_number }}"
          echo "name=$TAG" >> "$GITHUB_OUTPUT"
          echo "user_apk=LotteryHistoryQuery_${TAG}.apk" >> "$GITHUB_OUTPUT"
          echo "admin_apk=LotteryAdmin_${TAG}.apk" >> "$GITHUB_OUTPUT"
          echo "TAG=$TAG"
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
      - name: Build User App Release APK
        run: |
          sed -i '/org.gradle.java.home/d' gradle.properties
          sed -i '/proxyHost/d' gradle.properties
          sed -i '/proxyPort/d' gradle.properties
          sed -i '/nonProxyHosts/d' gradle.properties
          echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m" >> gradle.properties
          gradle assembleRelease --no-daemon -x test
      - name: Build Admin App Release APK
        run: |
          gradle :admin-app:assembleRelease --no-daemon -x test
      - name: 收集构建产物
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          if [ -z "$APK" ]; then
            echo "NO USER APK"
            find app/build/outputs -type f
            exit 1
          fi
          cp "$APK" "${{ steps.tag.outputs.user_apk }}"
          ls -lh "${{ steps.tag.outputs.user_apk }}"
          ADMIN_APK=$(find admin-app/build/outputs/apk/release -name "*.apk" | head -1)
          if [ -n "$ADMIN_APK" ]; then
            cp "$ADMIN_APK" "${{ steps.tag.outputs.admin_apk }}"
            ls -lh "${{ steps.tag.outputs.admin_apk }}"
          else
            echo "NO ADMIN APK"
          fi
      - name: 下传 APK 到服务器
        if: env.SERVER_URL != ''
        env:
          SERVER_URL: ${{ secrets.SERVER_URL }}
          SERVER_TOKEN: ${{ secrets.SERVER_TOKEN }}
        run: |
          HTTP_CODE=$(curl -sS -o /tmp/upload_resp.txt -w "%{http_code}" -X POST "${SERVER_URL}/api/upload-apk" -H "Authorization: Bearer ${SERVER_TOKEN}" -F "apk=@${{ steps.tag.outputs.user_apk }}")
          echo "user: $HTTP_CODE $(head -3 /tmp/upload_resp.txt)"
          if [ -f "${{ steps.tag.outputs.admin_apk }}" ]; then
            HTTP_CODE=$(curl -sS -o /tmp/upload_resp.txt -w "%{http_code}" -X POST "${SERVER_URL}/api/upload-apk" -H "Authorization: Bearer ${SERVER_TOKEN}" -F "apk=@${{ steps.tag.outputs.admin_apk }}")
            echo "admin: $HTTP_CODE $(head -3 /tmp/upload_resp.txt)"
          fi
      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: "${{ steps.tag.outputs.name }} 云端部署版 · 双端 APK"
          body: |
            ## ${{ steps.tag.outputs.name }} · 双端 APK
            ### 用户端 APP
            - `${{ steps.tag.outputs.user_apk }}`
            ### 管理端 APP
            - `${{ steps.tag.outputs.admin_apk }}`
          files: |
            ${{ steps.tag.outputs.user_apk }}
            ${{ steps.tag.outputs.admin_apk }}
          prerelease: false