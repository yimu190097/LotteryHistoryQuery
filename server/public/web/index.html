<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>开奖历史查询 - 用户端网页版（APK像素级还原）</title>
<style>
/* ============ 配色与字号 ============ */
:root{
  --red_ball:#D32F2F; --blue_ball:#1976D2; --white_ball:#FFFFFF;
  --ball_text_selected:#FFFFFF; --ball_text_normal:#333333; --ball_border:#CCCCCC;
  --primary_red:#C62828; --primary_blue:#1565C0;
  --bg_light:#F5F5F5; --surface:#FFFFFF;
  --text_primary:#212121; --text_secondary:#555555; --text_hint:#444444;
  --divider:#E0E0E0; --divider_subtle:#E0E0E0;
  --button_red:#C62828; --button_gray:#9E9E9E; --surface_variant:#F5F5F5;
  --fs-base:0px;
  --micro:calc(10px + var(--fs-base)); --tiny:calc(11px + var(--fs-base));
  --small:calc(12px + var(--fs-base)); --body:calc(13px + var(--fs-base));
  --title:calc(14px + var(--fs-base)); --subtitle:calc(15px + var(--fs-base));
  --card_margin:4px; --card_padding:6px; --page_padding:6px;
  --max-width:1200px;
}
:root.large{--fs-base:2px;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg_light);
  display:flex;align-items:flex-start;justify-content:center;
  min-height:100vh;
}
#device{
  width:100%;max-width:var(--max-width);background:var(--surface);overflow:visible;position:relative;
  min-height:100vh;
}
#screen{min-height:100vh;background:var(--bg_light);
  overflow-y:auto;position:relative;scrollbar-width:none;-ms-overflow-style:none;}
#screen::-webkit-scrollbar{display:none;}

/* ================= Toolbar ================= */
#toolbar{background:var(--primary_red);height:40px;display:flex;align-items:center;
  padding:0 4px;position:sticky;top:0;z-index:20;gap:2px;}
#toolbar .title{flex:1;color:#fff;font-size:16px;font-weight:bold;padding-left:4px;white-space:nowrap;overflow:hidden;}
#toolbar .act{color:#fff;font-size:11px;padding:4px 6px;border-radius:4px;cursor:pointer;white-space:nowrap;font-weight:600;background:rgba(255,255,255,.12);min-height:30px;display:flex;align-items:center;}
#toolbar .act:active{background:rgba(255,255,255,.25);}

/* ================= 最新开奖区（白底） ================= */
#latestSection{background:#fff;}
#latestHead{display:flex;align-items:center;padding:6px 10px 2px;}
#latestHead .t{flex:1;font-size:var(--body);font-weight:bold;color:var(--text_primary);}
#latestHead .all{color:var(--primary_red);font-size:var(--small);font-weight:bold;padding:2px 8px;cursor:pointer;}
#latestScroller{display:flex;gap:0;overflow-x:auto;padding:2px 4px 6px;scrollbar-width:none;}
#latestScroller::-webkit-scrollbar{display:none;}
.lcard{flex:0 0 auto;width:140px;margin:3px;padding:5px;border-radius:5px;
  border:1px solid #E0E0E0;background:#fff;cursor:pointer;}
.lcard .r1{display:flex;align-items:center;}
.lcard .ln{font-size:12px;font-weight:bold;color:var(--primary_red);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-right:3px;}
.lcard .iss{flex:1;text-align:right;font-size:10px;color:var(--text_secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.lcard .dt{font-size:10px;color:var(--text_secondary);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.lcard .balls{display:flex;flex-wrap:wrap;margin-top:2px;}
.lcard .bt{width:20px;height:20px;line-height:20px;text-align:center;border-radius:50%;
  font-size:10px;font-weight:700;color:#fff;margin:1px;}
.lcard .plus{font-size:11px;color:var(--text_secondary);margin:0 2px;line-height:16px;}
.lcard .view{margin-top:2px;text-align:right;font-size:10px;font-weight:bold;color:var(--primary_red);}

/* ================= 数据状态条 ================= */
#dataStatus{background:#FFF3E0;color:#E65100;font-size:var(--small);text-align:center;
  padding:4px 12px;line-height:1.5;}

/* ================= 用户信息栏 ================= */
#userBar{display:flex;align-items:center;padding:4px 10px;gap:8px;font-size:var(--small);}
#userBar.vip{background:linear-gradient(135deg,#FFF8E1,#FFECB3);}
#userBar.free-ok{background:#E8F5E9;}
#userBar.free-low{background:#FFF3E0;}
#userBar.free-out{background:#FFEBEE;}
#userBar.guest{background:var(--bg_light);}
#userPhone{color:var(--primary_red);font-size:var(--small);font-weight:bold;padding:2px 0;cursor:pointer;white-space:nowrap;}
#userBar .dv{width:1px;height:16px;background:#E0E0E0;flex-shrink:0;}
#quotaInfo{flex:1;font-weight:600;line-height:1.3;}
#quotaInfo .qtag{display:inline-block;font-size:11px;border-radius:3px;padding:1px 6px;margin-right:4px;font-weight:700;}
#quotaInfo .qtag.vip{background:#FF8F00;color:#fff;}
#quotaInfo .qtag.free{background:#E0E0E0;color:#616161;}
#quotaInfo .qtag.warn{background:#E65100;color:#fff;animation:pulse 1.5s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.6;}}
#upgradeBtn{display:none;font-size:11px;font-weight:bold;color:#fff;background:var(--primary_red);border-radius:4px;padding:4px 8px;cursor:pointer;white-space:nowrap;}

/* ================= 彩种 Tab（2×4 吸顶） ================= */
#tabBar{background:var(--primary_red);position:sticky;top:40px;z-index:19;padding:4px 4px 2px;}
#tabGrid{display:flex;overflow-x:auto;gap:4px;padding-bottom:2px;scrollbar-width:none;}
#tabGrid::-webkit-scrollbar{display:none;}
.tab{flex:0 0 auto;height:40px;min-width:68px;display:flex;align-items:center;justify-content:center;border-radius:5px;
  color:#E6FFFFFF;font-size:13px;font-weight:bold;border:1px solid rgba(255,255,255,.35);padding:0 6px;
  background:transparent;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tab.on{background:#fff;color:var(--primary_red);border:2px solid var(--primary_red);}
#whiteLine{height:1px;background:#fff;opacity:.75;margin-top:4px;}

/* ================= 内容区 ================= */
#content{padding:var(--page_padding);}
.card{background:#fff;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.15);
  margin-bottom:var(--card_margin);padding:var(--card_padding);}

/* 按期号查询 */
#issueCard .t{color:var(--primary_red);font-size:var(--title);font-weight:bold;margin-bottom:4px;}
#issueHint{font-size:var(--micro);color:var(--text_secondary);margin-bottom:4px;line-height:1.3;}
#issueRow{display:flex;align-items:center;}
#issueInput{flex:1;height:36px;border:1px solid #CFD8DC;border-radius:5px;padding:0 8px;
  font-size:var(--body);color:var(--text_primary);background:#fff;outline:none;}
#issueInput::placeholder{color:var(--text_secondary);}
#btnByIssue{flex:0 0 auto;height:36px;line-height:36px;margin-left:4px;padding:0 12px;
  background:var(--primary_blue);color:#fff;font-size:var(--small);border-radius:5px;
  text-align:center;cursor:pointer;font-weight:600;}

/* 选号对比 */
#pickCard .lab{color:var(--primary_red);font-size:var(--title);font-weight:bold;margin-bottom:4px;}
#pkSelectedText{color:var(--primary_red);font-size:var(--micro);margin-top:1px;margin-bottom:2px;min-height:18px;}
#pkSelectedBalls{display:flex;flex-wrap:wrap;margin-bottom:4px;min-height:28px;}
#pkTitle{color:var(--text_primary);font-size:var(--small);font-weight:bold;}
#pkGrid{display:flex;flex-wrap:wrap;margin-top:2px;margin-bottom:4px;}
/* 后区 */
#scSection{margin-top:1px;}
#scSelectedText{color:var(--primary_blue);font-size:var(--micro);margin-bottom:2px;min-height:18px;}
#scSelectedBalls{display:flex;flex-wrap:wrap;margin-bottom:4px;min-height:28px;}
#scTitle{color:var(--text_primary);font-size:var(--small);font-weight:bold;}
#scGrid{display:flex;flex-wrap:wrap;margin-top:2px;margin-bottom:8px;}
/* 模式 Chips（3D/排列三） */
#chipRow{display:flex;margin:2px 0 1px;}
.chip{font-size:var(--micro);font-weight:bold;padding:4px 10px;border-radius:4px;
  margin-right:4px;cursor:pointer;border:none;}
.chip.on{background:var(--primary_red);color:#fff;}
.chip.off{background:#ECEFF1;color:#546E7A;}
/* 位置球（3D/排列三 百十个） */
#posRow{display:flex;justify-content:center;margin-bottom:4px;gap:0;}
.posCol{flex:1;text-align:center;}
.posCol .pt{color:#546E7A;font-size:10px;padding-bottom:2px;}
.posCol .pball{width:24px;height:24px;line-height:24px;margin:0 auto;border-radius:50%;
  font-size:10px;font-weight:700;color:#BDBDBD;background:#fff;border:1px solid #BDBDBD;cursor:pointer;}
.posCol .pball.on{background:var(--primary_red);color:#fff;border-color:var(--primary_red);}
.posCol .ptip{color:#9E9E9E;font-size:9px;padding-top:1px;}
/* 选号球 */
.ball{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;
  font-family:monospace;font-weight:700;background:#fff;border:1px solid var(--ball_border);
  color:var(--ball_text_normal);cursor:pointer;user-select:none;}
.ball.on{background:var(--primary_red);border-color:var(--primary_red);color:#fff;}
.ball.sec.on{background:var(--primary_blue);border-color:var(--primary_blue);color:#fff;}

/* 按钮行 */
#btnRow{display:flex;align-items:center;}
#btnReset,#btnQuery{height:38px;flex:1;display:flex;align-items:center;justify-content:center;
  border-radius:5px;font-size:var(--small);font-weight:600;color:#fff;cursor:pointer;border:none;}
#btnReset{background:var(--button_gray);margin-right:4px;}
#btnQuery{background:var(--button_red);margin-left:4px;}

/* ================= 查询结果 ================= */
#resultCard .head{display:flex;align-items:center;padding-bottom:2px;}
#resultCard .ht{flex:1;text-align:center;font-size:var(--title);font-weight:bold;color:var(--text_primary);}
#btnHistory{font-size:var(--micro);font-weight:bold;color:var(--primary_red);
  background:#FFF0EC;border:1px solid #F4C7BC;border-radius:3px;padding:2px 6px;cursor:pointer;}
#selText{padding-bottom:1px;font-size:var(--small);color:var(--text_hint);line-height:1.3;white-space:pre-wrap;}
#resultBallsRow .rb{display:flex;align-items:center;margin-top:1px;flex-wrap:wrap;}
#resultBallsRow .rblb{color:var(--red_ball);font-size:var(--micro);font-weight:bold;margin-right:3px;}
#resultBallsRow .rbsl{color:var(--blue_ball);font-size:var(--micro);font-weight:bold;margin-right:3px;}
#resultBallsRow .ball{pointer-events:none;}
.hline{height:0.5px;background:var(--divider);margin:2px 0;}
/* 结果表头 */
#tblHead{display:flex;align-items:center;padding:4px 0 2px;background:#F7F7F7;}
#tblHead span{text-align:center;font-weight:bold;}
#tblHead .hPrize{flex:1.3;font-size:var(--small);color:var(--text_primary);}
#tblHead .hPri{flex:1.1;font-size:var(--small);color:var(--red_ball);}
#tblHead .hSec{flex:1.1;font-size:var(--small);color:var(--blue_ball);}
#tblHead .hCnt{flex:0.9;font-size:var(--small);color:var(--text_primary);}
#tblHead .hAct{flex:1.1;font-size:var(--small);color:var(--text_primary);}
/* 结果行 */
.row{display:flex;align-items:center;padding:0;}
.row:nth-child(even){background:#FAFAFA;}
.row div{text-align:center;padding:6px 2px;font-size:13px;}
.row .cPrize{flex:1.3;font-weight:bold;}
.row .cPri{flex:1.1;font-weight:bold;}
.row .cSec{flex:1.1;font-weight:bold;}
.row .cCnt{flex:0.9;font-weight:bold;}
.row .cAct{flex:1.1;}
.row .actbtn{padding:4px 0;border-radius:5px;font-size:12px;font-weight:bold;color:#fff;display:inline-block;min-width:42px;cursor:pointer;}
.row .actbtn.yes{background:var(--button_red);}
.row .actbtn.no{background:var(--button_gray);}
.rdiv{height:0.5px;background:#EFEFEF;}

/* ================= 弹窗遮罩 ================= */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:50;}
.mask.show{display:flex;}
.dialog{width:340px;max-height:82vh;background:#fff;border-radius:8px;display:flex;flex-direction:column;overflow:hidden;}
.dialog .dhead{position:relative;padding:10px;text-align:center;font-size:var(--title);font-weight:bold;color:var(--text_primary);}
.dialog .dhead .close{position:absolute;right:8px;top:50%;transform:translateY(-50%);color:var(--text_secondary);font-size:var(--body);cursor:pointer;padding:4px 10px;}
.dialog .dbody{overflow-y:auto;padding:0 10px 10px;scrollbar-width:none;}
.dialog .dbody::-webkit-scrollbar{display:none;}

/* 授权/登录 */
.auth-field{height:40px;border:1px solid #CFD8DC;border-radius:6px;padding:0 10px;font-size:var(--body);width:100%;margin-bottom:10px;outline:none;}
.auth-btn{height:44px;border-radius:6px;background:var(--button_red);color:#fff;font-size:var(--body);font-weight:bold;display:flex;align-items:center;justify-content:center;cursor:pointer;border:none;width:100%;}
.auth-switch{text-align:center;color:var(--primary_red);font-size:var(--small);margin-top:10px;cursor:pointer;}
.auth-title{font-weight:bold;}

/* 查询历史条目 & 详情 */
.hitem{padding:5px;border-bottom:0.5px solid var(--divider);}
.hitem .r0{display:flex;align-items:center;margin-bottom:2px;}
.hitem .idx{color:var(--text_secondary);font-size:var(--micro);min-width:16px;text-align:center;}
.hitem .iss{color:var(--text_primary);font-size:var(--small);font-weight:bold;margin-left:4px;font-family:monospace;}
.hitem .dt{flex:1;color:var(--text_secondary);font-size:var(--micro);text-align:right;margin-left:4px;}
.hitem .badge{font-size:var(--micro);font-weight:bold;color:#1B5E20;background:#E8F5E9;border-radius:3px;padding:1px 4px;border:1px solid #A5D6A7;}
.hitem .balls{display:flex;flex-wrap:wrap;margin-top:2px;}
.hitem .bt{width:22px;height:22px;line-height:22px;text-align:center;border-radius:50%;font-size:10px;font-weight:700;color:#fff;margin:1px;}
.hitem .view{text-align:right;margin-top:3px;}
.hitem .view span{font-size:var(--micro);font-weight:bold;color:#fff;background:var(--button_red);border-radius:4px;padding:3px 8px;cursor:pointer;}
.tierRow{display:flex;align-items:center;border-bottom:0.5px solid var(--divider);padding:6px 2px;font-size:13px;}
.tierRow .nm{flex:1;}
.tierRow .nm .pr{font-weight:bold;}
.tierRow .nm .pr.off{color:#9E9E9E;}
.tierRow .nm .mc{font-size:10px;color:#546E7A;margin-top:1px;line-height:1.2;}
.tierRow .cnt{text-align:right;font-size:11px;color:var(--text_secondary);min-width:46px;line-height:1.2;}
.tierRow .cnt .apn{font-size:9px;color:#1565C0;}
.tierRow .amt{text-align:right;font-weight:bold;color:var(--primary_red);margin-left:2px;min-width:62px;line-height:1.2;}
.tierRow .amt .apa{font-size:9px;color:#1565C0;font-weight:normal;}
.tierAppend .nm{padding-left:12px;}
.tierAppend .cnt,.tierAppend .amt{font-size:11px;color:#1565C0;}
.tierOff{background:#F5F5F5;}
.empty{text-align:center;color:var(--text_secondary);padding:24px;font-size:var(--small);}

/* ============ 响应式适配 ============ */
/* 桌面端：内容区左右分栏 */
@media (min-width: 768px) {
  :root { --max-width: 1200px; }
  body { padding: 8px 0; }
  #content { display: flex; flex-wrap: wrap; gap: 8px; }
  #issueCard { flex: 1 1 240px; min-width: 220px; }
  #pickCard { flex: 2 1 360px; min-width: 300px; }
  #resultCard { flex: 1 1 100%; }
  #latestScroller { flex-wrap: wrap; }
  .lcard { width: 150px; }
  .dialog { width: 480px; max-width: 90vw; }
  #maskAuth .dialog { width: 360px; }
  #maskSessions .dialog { width: 420px; }
  #maskLatest .dialog { height: 480px; }
}

@media (min-width: 1024px) {
  :root { --max-width: 1200px; }
  body { padding: 16px 0; }
  #latestScroller { flex-wrap: nowrap; }
  .dialog { width: 560px; max-width: 80vw; max-height: 85vh; }
  #maskAuth .dialog { width: 380px; }
  #maskSessions .dialog { width: 460px; }
}

@media (max-width: 360px) {
  :root { --card_padding: 6px; --page_padding: 6px; --micro: 10px; --tiny: 11px; --small: 12px; --body: 13px; }
  #toolbar .title { font-size: 14px; }
  #toolbar .act { font-size: 10px; padding: 3px 4px; }
  .tab { font-size: 12px; height: 36px; }
  .dialog { width: 95vw; max-height: 85vh; }
}
</style>
</head>
<body>
<div id="device">
  <div id="screen">
    <!-- Toolbar -->
    <div id="toolbar">
      <div class="title">开奖历史查询</div>
      <div class="act" onclick="toggleFontSize()" id="fontBtn" title="切换字号大小">Aa</div>
      <div class="act" id="loginBtn" onclick="openAuthDialog()">登录</div>
      <div class="act" onclick="downloadUserApk()">下载APP</div>
      <div class="act" onclick="refreshData()">刷新</div>
    </div>

    <!-- 最新开奖区 -->
    <div id="latestSection">
      <div id="latestHead">
        <div class="t">最新开奖</div>
        <div class="all" onclick="openLatestAll()">查看全部</div>
      </div>
      <div id="latestScroller"></div>
    </div>

    <!-- 数据状态条 -->
    <div id="dataStatus">正在获取最新开奖数据...</div>

    <!-- 用户信息栏 -->
    <div id="userBar">
      <div id="userPhone" onclick="openAuthDialog()">点击登录</div>
      <div class="dv"></div>
      <div id="quotaInfo"></div>
      <span id="upgradeBtn" onclick="openAuthDialog()">开通VIP</span>
    </div>

    <!-- 彩种 Tab -->
    <div id="tabBar">
      <div id="tabGrid"></div>
      <div id="whiteLine"></div>
    </div>

    <!-- 内容区 -->
    <div id="content">
      <!-- 按期号查询 -->
      <div class="card" id="issueCard">
        <div class="t" id="issueCardTitle">正在查询双色球</div>
        <div id="issueHint"></div>
        <div id="issueRow">
          <input id="issueInput" name="issue_no" inputmode="numeric" autocomplete="off" placeholder="">
          <div id="btnByIssue" onclick="doIssueQuery()">查该期</div>
        </div>
      </div>

      <!-- 选号对比 -->
      <div class="card" id="pickCard">
        <div class="lab" id="pkLabel">选号对比</div>
        <div id="chipRow"></div>
        <div id="posRow"></div>
        <div id="pkSelectedText"></div>
        <div id="pkSelectedBalls"></div>
        <div id="pkTitle"></div>
        <div id="pkGrid"></div>
        <div id="scSection">
          <div id="scSelectedText"></div>
          <div id="scSelectedBalls"></div>
          <div id="scTitle"></div>
          <div id="scGrid"></div>
        </div>
        <div id="btnRow">
          <div id="btnReset" onclick="resetSelection()">重置</div>
          <div id="btnQuery" onclick="doQuery()">开始查询</div>
        </div>
      </div>

      <!-- 查询结果 -->
      <div class="card" id="resultCard">
        <div class="head">
          <div class="ht">查询结果</div>
          <div id="btnHistory" onclick="openQueryRecord()">查询历史</div>
        </div>
        <div id="selText">请选择号码后点击查询</div>
        <div id="resultBallsRow">
          <div class="rb" id="rRedRow"><span class="rblb" id="rRedLabel"></span><span id="rRedBalls"></span></div>
          <div class="rb" id="rBlueRow" style="display:none"><span class="rbsl" id="rBlueLabel"></span><span id="rBlueBalls"></span></div>
        </div>
        <div class="hline"></div>
        <div id="tblHead"></div>
        <div class="hline"></div>
        <div id="resultContainer"></div>
      </div>
    </div>
  </div>
</div>

<!-- 最新开奖全部 弹窗 -->
<div class="mask" id="maskLatest" onclick="if(event.target===this)closeMask('maskLatest')"><div class="dialog" style="height:440px">
  <div class="dhead">最新开奖（8彩种）<span class="close" onclick="closeMask('maskLatest')">关闭</span></div>
  <div class="dbody" id="latestAllBody"></div>
</div></div>

<!-- 查询历史 弹窗 -->
<div class="mask" id="maskHistory" onclick="if(event.target===this)closeMask('maskHistory')"><div class="dialog">
  <div class="dhead">查询历史<span class="close" onclick="closeMask('maskHistory')">关闭</span></div>
  <div class="dbody" id="historyBody"></div>
</div></div>

<!-- 开奖详情 弹窗 -->
<div class="mask" id="maskDetail" onclick="if(event.target===this)closeMask('maskDetail')"><div class="dialog">
  <div class="dhead" id="detailTitle">开奖详情<span class="close" onclick="closeMask('maskDetail')">关闭</span></div>
  <div class="dbody" id="detailBody"></div>
</div></div>

<!-- 登录/注册 弹窗 -->
<div class="mask" id="maskAuth" onclick="if(event.target===this)closeMask('maskAuth')"><div class="dialog" style="width:360px">
  <div class="dhead auth-title" id="authTitle">登录<span class="close" onclick="closeMask('maskAuth')">关闭</span></div>
  <div class="dbody">
    <input class="auth-field" id="authPhone" name="phone" placeholder="请输入手机号" inputmode="numeric" autocomplete="tel">
    <input class="auth-field" id="authPass" name="password" type="password" placeholder="请输入密码（至少6位）" autocomplete="current-password">

/* ---------- 认证状态管理 ---------- */
var authState = {
  token: null,
  phone: null,
  nickname: null,
  planType: null,
  freeUsed: 0,
  freeLimit: 2,
  monthlyExpireAt: null,
  vipExpired: false

function authHeaders(extra) {
  var h = extra || {};
  if (authState.token) h['Authorization'] = 'Bearer ' + authState.token;
  return h;
}

function maskedPhone(ph) {
  return ph ? ph.replace(/^(\d{3})\d{4}(\d{4})$/, '$1****$2') : '';
}

function fmtQuota(planType, freeUsed, freeLimit, monthlyExpireAt, vipExpired) {
  var VIP_LABELS = { 'MONTHLY_VIP': '月VIP', 'QUARTERLY_VIP': '季VIP', 'SEMI_ANNUAL_VIP': '半年VIP', 'ANNUAL_VIP': '年VIP' };
  if (planType && planType !== 'FREE') {
    if (monthlyExpireAt) {
      var days = Math.ceil((monthlyExpireAt - Date.now()) / 86400000);
      if (days > 0) return '<span class="qtag vip">' + (VIP_LABELS[planType] || planType) + '</span>无限次·剩余 ' + days + ' 天';
      return '<span class="qtag warn">VIP已过期</span>今日免费已用 ' + freeUsed + '/' + freeLimit + ' 次';
    }
    return '<span class="qtag vip">' + (VIP_LABELS[planType] || planType) + '</span>无限次';
  }
  if (vipExpired) return '<span class="qtag warn">VIP已过期</span>今日免费已用 ' + freeUsed + '/' + freeLimit + ' 次';
  if (freeUsed >= freeLimit) return '<span class="qtag warn">已用完</span>今日免费已用 ' + freeUsed + '/' + freeLimit + ' 次';
  if (freeUsed >= freeLimit - 1) return '<span class="qtag free">免费</span>今日免费已用 ' + freeUsed + '/' + freeLimit + ' 次';
  return '<span class="qtag free">免费</span>今日免费已用 ' + freeUsed + '/' + freeLimit + ' 次';
}

function updateUserBar() {
  var bar = $('userBar');
  var upgrade = $('upgradeBtn');
  if (authState.token) {
    $('userPhone').textContent = maskedPhone(authState.phone);
    $('loginBtn').textContent = '退出';
    $('quotaInfo').innerHTML = fmtQuota(authState.planType, authState.freeUsed, authState.freeLimit, authState.monthlyExpireAt, authState.vipExpired);
    // 颜色条
    bar.className = '';
    if (authState.planType && authState.planType !== 'FREE' && !authState.vipExpired) {
      bar.classList.add('vip');
    } else if (authState.freeUsed >= authState.freeLimit) {
      bar.classList.add('free-out');
      upgrade.style.display = 'inline-block';
    } else if (authState.freeUsed >= authState.freeLimit - 1) {
      bar.classList.add('free-low');
      upgrade.style.display = 'none';
    } else {
      bar.classList.add('free-ok');
      upgrade.style.display = 'none';
    }
  } else {
    $('userPhone').textContent = '点击登录';
    $('loginBtn').textContent = '登录';
    $('quotaInfo').innerHTML = '登录后每日免费查询 ' + authState.freeLimit + ' 次';
    bar.className = 'guest';
    upgrade.style.display = 'none';
  }
}

async function fetchFreeQuotaLimit() {
  try {
    var res = await fetch('/api/users/client/config');
    if (res.ok) {
      var data = await res.json();
      authState.freeLimit = data.free_query_limit || 2;
    }
  } catch(e) {}
}

async function fetchQuota() {
  if (!authState.token) return;
  try {
    var res = await fetch('/api/users/client/quota', { headers: authHeaders() });
    if (res.status === 401) { logout(); return; }
    if (res.ok) {
      var data = await res.json();
      authState.planType = data.planType;
      authState.freeUsed = data.freeUsed || 0;
      authState.freeLimit = data.freeLimit || 2;
      authState.monthlyExpireAt = data.monthlyExpireAt;
      authState.vipExpired = data.vipExpired || false;
    }
  } catch(e) {}
  updateUserBar();
}

function saveAuthSession(loginResp) {
  authState.token = loginResp.token;
  authState.phone = loginResp.phone;
  authState.nickname = loginResp.nickname;
  authState.planType = loginResp.planType;
  authState.freeUsed = loginResp.freeUsed || 0;
  authState.freeLimit = loginResp.freeLimit || 2;
  authState.monthlyExpireAt = loginResp.monthlyExpireAt;
  authState.vipExpired = loginResp.vipExpired || false;
  try {
    localStorage.setItem('authToken', loginResp.token);
    localStorage.setItem('authPhone', loginResp.phone);
  } catch(e) {}
  // 显示终端提示
  if (loginResp.notice) toast(loginResp.notice);
  updateUserBar();
}

function logout() {
  authState.token = null;
  authState.phone = null;
  authState.nickname = null;
  authState.planType = null;
  authState.freeUsed = 0;
  authState.freeLimit = 2;
  authState.monthlyExpireAt = null;
  authState.vipExpired = false;
  try {
    localStorage.removeItem('authToken');
    localStorage.removeItem('authPhone');
  } catch(e) {}
  updateUserBar();
  toast('已退出登录');
}

async function checkAuthOnLoad() {
  await fetchFreeQuotaLimit();
  var token = null, phone = null;
  try {
    token = localStorage.getItem('authToken');
    phone = localStorage.getItem('authPhone');
  } catch(e) {}
  if (token && phone) {
    authState.token = token;
    authState.phone = phone;
    await fetchQuota();
  } else {
    updateUserBar();
  }
}

async function consumeOneQuery() {
  if (!authState.token) {
    // 未登录不允许查询（必须先登录）
    return { ok: false, msg: '请先登录后查询' };
  }
  // 已登录：调服务器扣减
  try {
    var clientOpId = 'web_' + Date.now() + '_' + Math.random().toString(36).substring(2, 10);
    var res = await fetch('/api/users/client/consume', {
      method: 'POST',
      headers: authHeaders({ 'Content-Type': 'application/json' }),
      body: JSON.stringify({ phone: authState.phone, count: 1, clientOpId: clientOpId })
    });
    if (res.status === 401) { logout(); return { ok: false, msg: '登录已过期，请重新登录' }; }
    if (res.status === 403) {
      var err = await res.json();
      if (err.freeUsed !== undefined) authState.freeUsed = err.freeUsed;
      if (err.freeLimit !== undefined) authState.freeLimit = err.freeLimit;
      updateUserBar();
      return { ok: false, msg: '今日免费次数已用完（明日0点刷新），开通VIP即享无限次查询', long: true };
    }
    if (res.ok) {
      var data = await res.json();
      authState.freeUsed = data.freeUsed;
      authState.freeLimit = data.freeLimit;
      authState.planType = data.planType;
      updateUserBar();
      return { ok: true };
    }
    return { ok: false, msg: '扣减失败，请重试' };
  } catch(e) {
    return { ok: false, msg: '网络错误：' + e.message };
  }
}

/* ---------- 球尺寸 / 列数（computeBallLayout 原样，适配动态宽度） ---------- */
function ballLayout(){
  var pickCard = document.getElementById('pickCard');
  var cardW = pickCard ? (pickCard.offsetWidth - 24) : 420;
  var totalPad = 12*2, avail = Math.min(cardW, 600) - totalPad, margin = 2;
  var range = cur.mainMax - cur.mainMin + 1;
  var columns;
  if(range<=10) columns=5;
  else if(range<=12) columns=6;
  else if(range<=22) columns=6;
  else if(range<=30) columns=7;
  else columns=7;
  var bs = Math.floor((avail - columns*margin)/columns);
  while(bs < 28 && columns > 4){columns--; bs = Math.floor((avail - columns*margin)/columns);}
  bs = Math.min(bs,34); if(bs<28)bs=28;
  return {cols:columns, size:bs, margin:margin};
}

function renderChips(){

  $('chipRow').querySelectorAll('.chip').forEach(function(c){
    c.onclick=function(){modeIdx=+c.getAttribute('data-m');renderChips();refreshPositional();};
  });
}
function makeBall(num,isPri){
  var L=ballLayout();
  var b=document.createElement('div');
  b.className='ball'+(isPri?'':' sec');
  b.style.width=L.size+'px'; b.style.height=L.size+'px';
  b.style.margin=L.margin+'px';
  b.style.fontSize='12px';
  b.textContent=pad2(num);
  b.setAttribute('data-n',num);
  b.setAttribute('data-p',isPri?'1':'0');
  return b;
}
function bindGrid(){
  $('pkGrid').querySelectorAll('.ball').forEach(function(b){
    b.onclick=function(){onBall(+(b.getAttribute('data-n')),true);};
  });
}
function bindSecGrid(){
  $('scGrid').querySelectorAll('.ball').forEach(function(b){
    b.onclick=function(){onBall(+(b.getAttribute('data-n')),false);};
  });
}
function onBall(num,isPri){
  if(isPri && cur.pos){
    // 位置式：填槽
    var idx=posVals.indexOf(num);
    if(idx>=0){posVals[idx]=-1;clearBallGridSel(num,true);}
    else{
      var slot=posVals.indexOf(-1);
      if(slot<0){var old=posVals[2];posVals[2]=num;clearBallGridSel(old,true);}
      else posVals[slot]=num;
    }
    refreshPositional();
  } else if(isPri){
    if(selMain.has(num)){selMain.delete(num);clearBallGridSel(num,true);}
    else{selMain.add(num);setBallGridSel(num,true);}
  } else {
    if(selSec.has(num)){selSec.delete(num);clearBallGridSel(num,false);}
    else{selSec.add(num);setBallGridSel(num,false);}
  }
  updateSelectedText();
}
function ballEl(grid,num,isPri){
  var sel=isPri?$('pkGrid'):$('scGrid');
  return Array.from(sel.children).find(function(b){return +(b.getAttribute('data-n'))==num&&+(b.getAttribute('data-p'))==(isPri?1:0);});
}
function setBallGridSel(num,isPri){var b=ballEl(null,num,isPri); if(b)b.classList.add('on');}
function clearBallGridSel(num,isPri){var b=ballEl(null,num,isPri); if(b)b.classList.remove('on'); else refreshGridFromSet();}
function refreshGridFromSet(){
  $('pkGrid').querySelectorAll('.ball').forEach(function(b){var n=+(b.getAttribute('data-n'));b.classList.toggle('on',selMain.has(n));});
  $('scGrid').querySelectorAll('.ball').forEach(function(b){var n=+(b.getAttribute('data-n'));b.classList.toggle('on',selSec.has(n));});
}
function refreshPositional(){
  $('posRow').querySelectorAll('.pball').forEach(function(p){
    var i=+(p.getAttribute('data-i'));var v=posVals[i];
    p.textContent=v<0?'-':pad2(v);
    p.className='pball'+(v<0?'':' on');
  });

/* 最新版规则 → 展示列（[奖项名, [[主中,后中],...], 单注奖金] 数组） */
function latestPr(t){
  return prForVersion(t.vers[0]);
}
/* 指定版本规则 → 展示列（与 latestPr 同结构，但按指定版本解析） */
function prForVersion(ver){
  var rules=ver.r, order=[], map={};
  rules.forEach(function(r){
    if(!map[r[2]]){map[r[2]]={name:r[2],conds:[],amt:r[3]};order.push(r[2]);}
    map[r[2]].conds.push([r[0],r[1]]);
  });
  return order.map(function(n){return [map[n].name,map[n].conds,map[n].amt];});
}
/* 按期开奖日期定位规则版本（与 APK rulesForDate 一致：日期 >= 生效日，取最新） */
function verForDate(t,date){
  if(!date||date.length!==10)return null;
  for(var i=0;i<t.vers.length;i++){if(date>=t.vers[i].d)return t.vers[i];}
  return null;
}
/* 单期命中前区/后区计数（3D/排列三 按直选/组3/组6） */
function hitCount(t,selPri,selPSet,selSec,d){
  if(t.pos&&selPri.length===3&&d.main.length===3){
    var pc=0;
    if(modeIdx===0){for(var i=0;i<3;i++)if(+(d.main[i])===selPri[i])pc++;}
    else{
      var ds=d.main.slice().map(function(x){return +x;}).sort(function(a,b){return a-b;});
      var sss=selPri.slice().map(function(x){return +x;}).sort(function(a,b){return a-b;});
      var multi=ds.join()===sss.join();
      if(!multi){pc=d.main.filter(function(x){return selPSet.has(+x);}).length;}
      else{
        var a=sss[0],b=sss[1],c=sss[2];
        var two=(a===b&&b!==c)||(b===c&&a!==b), all=a!==b&&b!==c;
        var ok=modeIdx===1?two:(modeIdx===2?all:true);
        pc=ok?3:2;
      }
    }
    return {pc:pc,sc:0};
  }
  var mp=d.main.filter(function(x){return selPSet.has(+x);}).length;
  var ms=t.hasSec?d.sec.filter(function(x){return selSec.has(+x);}).length:0;
  return {pc:mp,sc:ms};
}
function matchAll(selPri,selSec){
  var t=cur, selPSet=new Set(selPri);
  // 1) 每期独立用其规则版本算命中，写入聚合桶
  var buckets={};
  draws.forEach(function(d){
    var ver=verForDate(t,d.date)||t.vers[t.vers.length-1];
    for(var i=0;i<ver.r.length;i++){
      var r=ver.r[i];
      // 条件性奖级：福运奖(3+0)仅在当期开关开启时计入（对齐 App conditionalFlags）
      if(r[4]==='fuyun' && d.fuyun!==true) continue;
      var hc=hitCount(t,selPri,selPSet,selSec,d);
      if(hc.pc===r[0]&&hc.sc===r[1]){
        var key=ver.d+'|'+r[0]+'|'+r[1]+'|'+r[2];
        if(!buckets[key])buckets[key]={mp:r[0],ms:r[1],name:r[2],draws:[]};
        buckets[key].draws.push(d);
        break;
      }
    }
  });
  // 2) 按最新版奖项名顺序合并展示
  var latest=t.vers[0].r, uniqueNames=[], nameConds={}, latestByCond={};
  latest.forEach(function(r){
    if(!nameConds[r[2]]){nameConds[r[2]]=[];uniqueNames.push(r[2]);}
    nameConds[r[2]].push([r[0],r[1]]);
    latestByCond[r[0]+','+r[1]]=r[2];
  });
  var list=[], consumed={};
  uniqueNames.forEach(function(name){
    var conds=nameConds[name], one=conds.length===1, matched=[];
    Object.keys(buckets).forEach(function(k){
      if(consumed[k])return; var b=buckets[k];
      if(conds.some(function(c){return c[0]===b.mp&&c[1]===b.ms;})){matched=matched.concat(b.draws);consumed[k]=true;}
    });
    var amt=null; latest.forEach(function(r){if(r[2]===name&&amt===null)amt=r[3];});
    list.push({name:name,conds:conds,amt:amt,mp:one?conds[0][0]:-1,ms:one?conds[0][1]:-1,count:matched.length,matches:matched});
  });
  // 3) 剩余桶（老版本奖级，最新版无对应条件）→ 就近归属或保留原奖级名
  Object.keys(buckets).forEach(function(k){
    if(consumed[k])return; var b=buckets[k]; consumed[k]=true;
    var ln=latestByCond[b.mp+','+b.ms]||null;
    var existing=null;
    for(var i2=0;i2<list.length;i2++){if(list[i2].name===(ln||b.name)){existing=list[i2];break;}}
    if(existing){existing.matches=existing.matches.concat(b.draws);existing.count=existing.matches.length;existing.mp=-1;existing.ms=-1;}
    else{list.push({name:b.name,conds:[[b.mp,b.ms]],amt:null,mp:b.mp,ms:b.ms,count:b.draws.length,matches:b.draws});}
  });
  return list;
}

function fmtAmt(n){

  if(n>=10000){
    var wan=n/10000;

    if(s.indexOf('.0')===s.length-2)return wan+'万元';

}

function matchDesc(cfg,mp,ms){
  if(cfg.pos){

  if(mp>0&&ms>0)return '中'+mp+pl+' + '+ms+sl;

  if(mp===0&&ms>0)return '中'+ms+sl;

  }
  // 收集去重奖级名称，汇总命中规则
  var seenNames={},uniqNames=[],nameConds={},nameAmt={};
  rules.forEach(function(p){
    if(!seenNames[p[0]]){seenNames[p[0]]=true;uniqNames.push(p[0]);nameConds[p[0]]=[];nameAmt[p[0]]=p[2];}
    if(p[1]&&p[1].length)nameConds[p[0]]=nameConds[p[0]].concat(p[1]);
  });
  // 福运奖 & DLT 浮动状态（对齐 APK conditionalFlags）
  var fuyunState=null;
  if(cfg.code==='ssq'){
    var hasFuyunRule=rules.some(function(p){return p[0]==='福运奖';});
    if(hasFuyunRule){
      fuyunState=draw.fuyun?'ON':'OFF';
    }
  }
  // DLT 奖池浮动：对齐 APK DLT_2026_FLOAT 判定（UP/NORMAL/HOLD）
  var dltFloat=null;
  if(cfg.code==='dlt'){
    var jp=draw.jackpot?parseNumberSafe(draw.jackpot):null;
    if(jp!==null&&jp>=800000000)dltFloat='UP';
    else if(jp!==null)dltFloat='NORMAL';
    // jp===null → dltFloat stays null (HOLD: 奖池未知)
  }
  // DLT 追加数据
  var appendTiers=draw.appendTiers||[];
  var hasAppend=cfg.code==='dlt'&&appendTiers.length>0;
  // 逐奖级展示（合并基本+追加到一行，对齐 APK mergePrizeTiersWithRules）
  uniqNames.forEach(function(name){
    var td=tierByName[name];
    var ruleAmt=nameAmt[name];
    var conds=nameConds[name]||[];
    var isFuyunOff=(fuyunState==='OFF'&&name==='福运奖');
    // 命中规则文本（含 DLT 浮动信息，对齐 APK buildMatchText + 条件性奖级）
    var matchLines=[];
    conds.forEach(function(c){
      var desc=matchDesc(cfg,c[0],c[1]);
      if(!desc)return;
      // DLT 浮动金额判定（对齐 APK: UP/NORMAL/HOLD 三种状态都有前缀）
      if(dltFloat!==null&&ruleAmt!==null&&DLT_FLOAT_MAP[ruleAmt]){
        var actual=dltFloat==='UP'?DLT_FLOAT_MAP[ruleAmt]:ruleAmt;
        var prefix=dltFloat==='UP'?'本期奖池≥8亿已上浮':(dltFloat==='NORMAL'?'规则固定':'奖池未知，暂按规则固定');
        desc+='（'+prefix+'¥'+actual+'）';
      }else if(dltFloat===null&&ruleAmt!==null&&DLT_FLOAT_MAP[ruleAmt]){
        // HOLD: 奖池未知，仍显示提示
        desc+='（奖池未知，暂按规则固定¥'+ruleAmt+'）';
      }
      matchLines.push(desc);
    });
    var matchStr=matchLines.join(' / ');
    // DLT 追加数据
    var atd=hasAppend?appendTiers[uniqNames.indexOf(name)]||null:null;
    var appCnt=atd?atd.count:null;
    var baseCnt=td?td.count:null;
    var baseAmt=td?td.amount:null;
    var appAmt=atd?atd.amount:null;
    // 基本投注注数
    var baseCntStr='—';
    if(isFuyunOff){
      baseCntStr='—（奖池未达门槛，本奖项停发）';
    }else if(baseCnt!==null){
      baseCntStr=baseCnt>0?baseCnt.toLocaleString()+'注':'空开';
    }
    // 基本投注金额
    var baseAmtStr='—';
    if(isFuyunOff){
      baseAmtStr='—（奖池未达门槛，本奖项停发）';
    }else if(baseCnt!==null){
      if(baseAmt>0)baseAmtStr=fmtAmt(baseAmt);
      else if(baseCnt>0)baseAmtStr='—';
      else baseAmtStr='空开无奖金';
    }
    // 追加投注注数
    var appCntStr='';
    if(hasAppend&&atd){
      appCntStr=appCnt>0?appCnt.toLocaleString()+'注':(appCnt===0?'空开':'—');
    }
    // 追加投注金额
    var appAmtStr='';
    if(hasAppend&&atd){
      appAmtStr=appCnt>0&&appAmt>0?fmtAmt(appAmt):(appCnt>0?'—':'空开无奖金');
    }
    // 构建主行
    var rowClass='tierRow';
    if(isFuyunOff)rowClass+=' tierOff';
    html+='<div class="'+rowClass+'">'
      +'<div class="nm"><div class="pr'+(isFuyunOff?' off':'')+'">'+(isFuyunOff?name+'（本期不开放）':name)+'</div>'
      +(matchStr?'<div class="mc">'+matchStr+'</div>':'')
      +'</div>'
      +'<div class="cnt">'+baseCntStr+'</div>'
      +'<div class="amt">'+baseAmtStr+'</div>'
      +'</div>';
    // 追加投注独立行（在对应奖级下方展示）
    if(hasAppend&&atd){
      html+='<div class="tierRow tierAppend">'
        +'<div class="nm"><div class="pr" style="color:#1565C0;font-size:12px;">└ 追加投注</div></div>'
        +'<div class="cnt"><span class="apa">'+appCntStr+'</span></div>'
        +'<div class="amt"><span class="apa">'+appAmtStr+'</span></div>'
        +'</div>';
    }
  });
  return html;
}

/* ---------- 数据加载 ---------- */
/* 福运奖开关判定（对齐 App LotteryXlsParser，数据驱动优先 + 奖池兜底）：
   双色球数据源布局(0-based): 0期号 1日期 2-7红 8蓝 9-14出球顺序 15销售额 16奖池 17-28前6对奖级 29,30第7对(福运奖)
   官方公布第7对福运奖数据 → ON；否则奖池>=15亿 ON；<3亿 OFF；[3亿,15亿)迟滞区间保守 OFF */
function fuyunRaw(t){
  // 福运奖启停规则（官方）：奖池≥15亿启动，<3亿停止
  // 数据格式：2026版起每期固定7对奖级，第7对(t[29..30])为福运奖(注数,金额)
  // 注意：数据源始终包含第7对占位数据(0/5)，不能仅凭存在性判断ON/OFF
  var hasPair=t.length>30&&t[29]!==undefined&&t[30]!==undefined&&t[29]!=='-'&&t[30]!=='-';
  if(hasPair){
    var cnt=parseInt(t[29],10);
    if(cnt>0)return 'ON';  // 有人中福运奖，确定开启（数据驱动）
    // 注数为0：检查奖池阈值判断
    var jp=t.length>16?parseInt(t[16],10):0;
    if(!jp)return 'OFF';
    if(jp>=1500000000)return 'ON';  // ≥15亿=启动阈值
    if(jp<300000000)return 'OFF';   // <3亿=停止阈值
    return 'HOLD';  // [3亿,15亿)迟滞区间，回填
  }
  // 无第7对奖级（2003版数据）：奖池从未达15亿，福运奖不适用
  return 'OFF';
}
function parseNumberSafe(raw){
  var s=raw.trim();if(!s)return null;
  // 纯整数
  if(s.indexOf(',')===-1&&s.indexOf('.')===-1)return parseInt(s,10)||0;
  // 小数（无千分位）：8000.0 → 8000
  if(s.indexOf(',')===-1)return parseInt(s.split('.')[0],10)||0;
  // 美式千分位：84,337,222.00 → 84337222
  if(/^[+-]?\d{1,3}(?:,\d{3})*(?:\.\d+)?$/.test(s))return parseInt(s.replace(/,/g,'').split('.')[0],10)||0;
  // 欧式：84.337.222,00 → 84337222
  if(/^[+-]?\d{1,3}(?:\.\d{3})*(?:,\d+)?$/.test(s))return parseInt(s.replace(/\./g,'').split(',')[0],10)||0;
  return null;
}
function parseDraws(text){
  var lines=text.split(/\r?\n/),out=[];
  for(var i=0;i<lines.length;i++){
    var line=lines[i],tr=line.trim();
    if(!tr)continue;
    var t=tr.split(/\s+/);
    if(!/^\d{5,}$/.test(t[0]))continue;
    if(!/^\d{4}-/.test(t[1]))continue;
    var nums=[];
    var numEnd=2;
    for(var j=2;j<t.length;j++){if(/^\d{1,2}$/.test(t[j])){nums.push(t[j]);numEnd=j+1;}else break;}
    if(nums.length<cur.parseMain+cur.parseSec)continue;
    var main=nums.slice(0,cur.parseMain);
    var sec=cur.parseSec>0?nums.slice(cur.parseMain,cur.parseMain+cur.parseSec):[];
    var bmain=main.map(function(n){return pad2(+n);});
    var bsec=sec.map(function(n){return pad2(+n);});
    // 提取销售额和奖池（位于号码之后、奖级数据之前）
    var extraCount=cur.extraCount||2;
    var sales=null, jackpot=null;
    if(extraCount>=1&&numEnd<t.length)sales=t[numEnd];
    if(extraCount>=2&&numEnd+1<t.length)jackpot=t[numEnd+1];
    // 奖级数据从 numEnd+extraCount 开始
    var tierStart=numEnd+extraCount;
    var tiers=[];
    for(var k=0;k<15;k++){
      var ci=tierStart+k*2,ai=tierStart+k*2+1;
      if(ci>=t.length||ai>=t.length)break;
      var cRaw=t[ci],aRaw=t[ai];
      if(cRaw==='-'||aRaw==='-'||!cRaw||!aRaw){tiers.push(null);continue;}
      var cnt=parseNumberSafe(cRaw),amt=parseNumberSafe(aRaw);
      if(cnt===null||amt===null){tiers.push(null);continue;}
      tiers.push({count:cnt,amount:amt});
    }
    var validTiers=tiers.filter(function(x){return x!==null;});
    var ver=verForDate(cur,t[1]);
    var tierCount=ver&&ver.tc?ver.tc:(cur.tierCount||7);
    var displayTiers=validTiers.slice(0,tierCount);
    // DLT 追加投注数据提取（对齐 APK LotteryXlsParser 真实字段布局）
    // dlt2_desc.txt 1-based 布局（0-based 下标）：
    //   前缀 0-10 = 期号+日期+7号码(5前2后)+销售+奖池
    //   基本投注 11-24 = 7 对（基本1~7等，所有版本通用）
    //   基本尾部 25-28 = 2 对（2019版=基本8/9等；2009/2007=基本8等+忽略；2026/2014=全0忽略）
    //   追加投注 29-36 = 4 对（追加1~4等）
    //   追加5等 count = 37，amount = 基本5等×追加比例
    //   追加6~7等：源不单独给，count=0，amount = 基本6/7等×比例
    var appendTiers=null;
    if(cur.code==='dlt'&&ver&&ver.apc){
      var ratio=(ver.d>='2019-02-18')?0.8:0.6; // 2007~2014年追加比例60%，2019年起80%
      function baseAmtAt(i){var x=displayTiers[i];return (x&&x.amount>0)?x.amount:0;}
      var appendData=[];
      // 追加1~4等：4 对（下标 29~36）
      for(var ak=0;ak<4;ak++){
        var aci=29+ak*2,aai=30+ak*2;
        if(aci>=t.length||aai>=t.length){appendData.push(null);continue;}
        var acRaw=t[aci],aaRaw=t[aai];
        if(acRaw==='-'||aaRaw==='-'||!acRaw||!aaRaw){appendData.push(null);continue;}
        var acnt=parseNumberSafe(acRaw),aamt=parseNumberSafe(aaRaw);
        if(acnt===null||aamt===null){appendData.push(null);continue;}
        appendData.push({count:acnt,amount:aamt});
      }
      // 追加5等：count=字段38(下标37)，amount=基本5等×比例
      var a5Raw=t[37];
      var a5cnt=(a5Raw==='-'||!a5Raw)?0:(parseNumberSafe(a5Raw)||0);
      appendData.push({count:a5cnt,amount:Math.round(baseAmtAt(4)*ratio)});
      // 追加6~7等：count=0，amount=基本6/7等×比例
      appendData.push({count:0,amount:Math.round(baseAmtAt(5)*ratio)});
      appendData.push({count:0,amount:Math.round(baseAmtAt(6)*ratio)});
      appendTiers=appendData.slice(0,ver.apc);
    }
    out.push({issue:t[0],date:t[1],main:main,sec:sec,
      ballHtml:bmain.map(function(n){return '<span class="bt" style="background:var(--red_ball)">'+n+'</span>';}).join('')
      +(cur.hasSec&&bsec.length?('<span class="plus">+</span>'+bsec.map(function(n){return '<span class="bt" style="background:var(--blue_ball)">'+n+'</span>';}).join('')):''),
      dmain:bmain, dsec:bsec,
      sales:sales, jackpot:jackpot,
      fuyun:null, fyRaw:(cur.code==='ssq'?fuyunRaw(t):'OFF'),
      tiers:displayTiers, allTiers:tiers, appendTiers:appendTiers});
  }
  // fuyun hysteresis backfill: HOLD keeps prev state, ascending by issue
  if(cur.code==='ssq'){var asc=out.slice().sort(function(a,b){return a.issue<b.issue?-1:(a.issue>b.issue?1:0);});var prev=false;for(var k=0;k<asc.length;k++){var st=asc[k].fyRaw||'OFF';var v=(st==='ON')?true:((st==='OFF')?false:prev);asc[k].fuyun=v;prev=v;}}
  return out;
}

/* ---------- 下载 APP ---------- */
// APK 走 GitHub Release 国内镜像加速，避免 ngrok 隧道下载慢。
// 镜像候选逐个触发，全部失败才回落服务器 /downloads。
function triggerDownload(url,name){
  var a=document.createElement('a');
  a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
}
async function downloadUserApk(){
  var candidates=[];
  try{
    var res=await fetch('/api/apk/releases');
    if(res.ok){
      var payload=await res.json();
      if(payload&&payload.assets&&payload.assets.length){
        // 优先用户端安装包
        var apk=payload.assets.filter(function(a){return /history|user|用户/i.test(a.name)&&!/admin|管理/i.test(a.name);})[0]||payload.assets[0];
        candidates=apk.mirrors.concat([apk.githubUrl]);
        toast('正在使用加速镜像下载最新安装包…');
        triggerDownload(candidates.shift(),apk.name);
        return;
      }
    }
  }catch(e){ /* 落到下方服务器兜底 */ }
  try{
    var res2=await fetch('/api/apk-list');
    var files=await res2.json();
    if(!files||!files.length){toast('暂无可用安装包，稍后再试');return;}
    var apk2=files.find(function(f){return /user|用户/i.test(f.filename)&&!/admin|管理/i.test(f.filename);})||files[0];
    toast('镜像不可用，正在从服务器下载（可能较慢）…');
    triggerDownload(apk2.url,apk2.filename);
  }catch(e){toast('下载失败：'+e.message);}
}

async function submitAuth(){

  if(!ph||pw.length<6){toast('请输入手机号及至少6位密码');return;}
  $('authBtn').disabled=true;

  var endpoint=authMode==='login'?'client/login':'client/register';
  var body={phone:ph,password:pw};

  try{

      method:'POST',

    });

      toast(data.error||'操作失败');

    toast('网络错误：'+e.message);
  }finally{
    $('authBtn').disabled=false;
    renderAuth();
  }
}

/* ---------- 终端管理 ---------- */
async function showSessionManager(){
  if(!authState.token){toast('请先登录');return;}
  try{
    var res=await fetch('/api/users/client/sessions',{headers:authHeaders()});
    if(!res.ok){var err=await res.json();toast(err.error||'获取失败');return;}
    var data=await res.json();
    var now=Date.now();
    var html='<div class="dhead" style="padding:10px 14px">终端管理（最多 '+data.maxSessions+' 台）<span class="close" onclick="closeMask(\'maskSessions\')">关闭</span></div><div class="dbody" style="padding:0 8px 8px">';
    if(!data.sessions.length){html+='<div class="empty">暂无活跃终端</div>';}
    else{
      data.sessions.forEach(function(s){
        var dev=(s.deviceInfo||'Unknown').substring(0,50);
        var onlineBadge=s.online?'<span style="color:#2E7D32;font-weight:bold">● 在线</span>':'<span style="color:#9E9E9E">○ 离线</span>';
        html+='<div class="hitem" style="display:flex;align-items:center;padding:10px 6px">'
          +'<div style="flex:1;min-width:0"><div style="font-size:13px;font-weight:bold;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+dev+'</div>'
          +'<div style="font-size:12px;color:var(--text-secondary)">'+onlineBadge+' · '+s.ipAddress+' · '+new Date(s.lastActiveAt).toLocaleString()+'</div></div>'
          +(s.isCurrent?'<span style="font-size:11px;color:#fff;background:var(--primary_red);border-radius:4px;padding:2px 6px;margin-left:8px;white-space:nowrap">当前</span>'
          :'<span style="font-size:12px;color:var(--danger);margin-left:8px;cursor:pointer;white-space:nowrap" onclick="deleteMySession('+s.id+')">删除</span>')
          +'</div>';
      });
    }
    html+='</div>';
    $('sessionBody').innerHTML=html;
    showMask('maskSessions');
  }catch(e){toast('网络错误：'+e.message);}
}
async function deleteMySession(id){
  if(!confirm('确定要删除这个终端吗？'))return;
  try{
    var res=await fetch('/api/users/client/sessions/'+id,{method:'DELETE',headers:authHeaders()});
    if(!res.ok){var err=await res.json();toast(err.error||'删除失败');return;}
    toast('终端已删除');
    showSessionManager();
  }catch(e){toast('网络错误：'+e.message);}
}
